[project]
name = "parallel-o2"
version = "0.1.0a0"
description = "Parallel Circulation Oxygen Explorer: T01 environment and input contracts"
readme = "README.md"
requires-python = "==3.14.*"
license = "MIT"
authors = [{name = "Brian W. Locke"}]
dependencies = ["numpy==2.4.6"]

[dependency-groups]
dev = [
    "setuptools==82.0.1",
    "pytest",
    "ruff",
    "mypy",
    "jsonschema",
    "types-jsonschema",
    "matplotlib==3.11.2",
]

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parallel_o2 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["src/**/*.py", "tests/**/*.py", "scripts/repository.py", "scripts/fetch_assets.py", "scripts/reference_replay.py", "scripts/release_gate.py", "scripts/science_report.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts/repository.py", "scripts/fetch_assets.py", "scripts/reference_replay.py", "scripts/release_gate.py", "scripts/science_report.py"]
strict = true
